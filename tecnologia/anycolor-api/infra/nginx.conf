# Balanceador de carga de AnyColor: alterna las peticiones entre las 3 copias
# de la API (round-robin). Si una copia falla varias veces, se aparta 10 s y
# las demás siguen atendiendo.
worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;
  server_tokens off;          # no revela la versión de Nginx
  client_max_body_size 16k;   # la API no recibe archivos: peticiones pequeñas
  client_body_timeout 10s;    # corta clientes lentos (ataques tipo slowloris)
  client_header_timeout 10s;

  upstream api_anycolor {
    server anycolor-api-api-1:3001 max_fails=5 fail_timeout=10s;
    server anycolor-api-api-2:3001 max_fails=5 fail_timeout=10s;
    server anycolor-api-api-3:3001 max_fails=5 fail_timeout=10s;
    keepalive 256;            # reutiliza conexiones con las copias
    keepalive_requests 10000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api_anycolor;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # IP real de la clienta para el límite de peticiones. Se REEMPLAZA (no se agrega)
      # para que nadie pueda falsificarla enviando su propio X-Forwarded-For.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
      # Evidencia del balanceo para la demo (EQ-02/EQ-03). En producción real se quita
      # porque revela direcciones internas.
      add_header X-Atendido-Por $upstream_addr always;
    }
  }
}
