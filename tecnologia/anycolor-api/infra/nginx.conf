# Balanceador: alterna las peticiones entre las 3 copias de la API (round-robin).
# Si una copia se cae, se marca como fallida y las demás siguen atendiendo.
upstream api_anycolor {
  server anycolor-api-api-1:3001 max_fails=1 fail_timeout=5s;
  server anycolor-api-api-2:3001 max_fails=1 fail_timeout=5s;
  server anycolor-api-api-3:3001 max_fails=1 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  location / {
    proxy_pass http://api_anycolor;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_next_upstream error timeout http_502 http_503;
    add_header X-Atendido-Por $upstream_addr always;
  }
}
