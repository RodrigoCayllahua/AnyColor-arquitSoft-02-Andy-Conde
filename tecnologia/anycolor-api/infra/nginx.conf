# Balanceador de carga de AnyColor: alterna las peticiones entre las 3 copias
# de la API (round-robin). Si una copia falla varias veces, se aparta 10 s y
# las demás siguen atendiendo.
worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;

  upstream api_anycolor {
    server anycolor-api-api-1:3001 max_fails=5 fail_timeout=10s;
    server anycolor-api-api-2:3001 max_fails=5 fail_timeout=10s;
    server anycolor-api-api-3:3001 max_fails=5 fail_timeout=10s;
    keepalive 256;            # reutiliza conexiones con las copias
    keepalive_requests 10000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api_anycolor;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
      add_header X-Atendido-Por $upstream_addr always;
    }
  }
}
