# Desarrollo (solo bases):          docker compose up -d
# Sistema completo con 3 copias:    docker compose --profile completo up -d --build --scale api=3
# Pruebas de carga (k6):            docker compose run --rm k6 run /scripts/rendimiento-catalogo.js
services:
  postgres:
    image: postgres:16
    container_name: anycolor-postgres
    environment:
      POSTGRES_USER: anycolor
      POSTGRES_PASSWORD: anycolor
      POSTGRES_DB: anycolor
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anycolor-redis
    ports:
      - "6379:6379"

  # API sin estado: se pueden levantar N copias (--scale api=3)
  api:
    build: .
    profiles: ["completo"]
    environment:
      PUERTO: "3001"
      DATABASE_URL: postgres://anycolor:anycolor@postgres:5432/anycolor
      REDIS_URL: redis://redis:6379
      BLOQUEOS: redis
      CACHE: ${CACHE:-redis}
      JWT_SECRETO: cambia-esta-frase-por-una-larga-y-secreta
      JWT_DURACION: 8h
      URL_FRONTEND: http://localhost:3000
    depends_on: [postgres, redis]

  # Balanceador de carga: reparte las peticiones entre las copias de la API
  balanceador:
    image: nginx:1.27-alpine
    profiles: ["completo"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]

  # Pruebas de carga con k6
  k6:
    image: grafana/k6:0.57.0
    profiles: ["pruebas"]
    volumes:
      - ./pruebas-carga:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  datos-postgres:
