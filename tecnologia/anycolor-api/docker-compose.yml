# Levanta PostgreSQL y Redis para desarrollo con un solo comando:
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: anycolor-postgres
    environment:
      POSTGRES_USER: anycolor
      POSTGRES_PASSWORD: anycolor
      POSTGRES_DB: anycolor
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anycolor-redis
    ports:
      - "6379:6379"

volumes:
  datos-postgres:
