# Desarrollo (solo bases):          docker compose up -d
# Sistema completo con 3 copias:    docker compose --profile completo up -d --build --scale api=3
# Pruebas de carga (k6):            docker compose run --rm k6 run /scripts/rendimiento-catalogo.js
#
# SEGURIDAD: las claves NO se escriben aquí. Docker Compose las toma del archivo .env
# (que nunca se sube a GitHub). Ver .env.example.
services:
  postgres:
    image: postgres:16
    container_name: anycolor-postgres
    environment:
      POSTGRES_USER: anycolor
      POSTGRES_PASSWORD: ${DB_CLAVE:-anycolor}
      POSTGRES_DB: anycolor
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde esta PC, no desde la red
    volumes:
      - datos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anycolor-redis
    ports:
      - "127.0.0.1:6379:6379"   # solo accesible desde esta PC, no desde la red

  # API sin estado: se pueden levantar N copias (--scale api=3)
  api:
    build: .
    profiles: ["completo"]
    environment:
      PUERTO: "3001"
      DATABASE_URL: postgres://anycolor:${DB_CLAVE:-anycolor}@postgres:5432/anycolor
      REDIS_URL: redis://redis:6379
      BLOQUEOS: redis
      CACHE: ${CACHE:-redis}
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en el archivo .env}
      JWT_DURACION: ${JWT_DURACION:-2h}
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:3000}
      CONFIAR_EN_PROXY: "si"          # la API está detrás de Nginx
      SWAGGER: ${SWAGGER:-activado}   # en una producción real: desactivado
      LIMITE_PETICIONES: ${LIMITE_PETICIONES:-activado}  # "desactivado" solo para pruebas de carga con k6
    depends_on: [postgres, redis]

  # Balanceador de carga: reparte las peticiones entre las copias de la API
  balanceador:
    image: nginx:1.27-alpine
    profiles: ["completo"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]

  # Pruebas de carga con k6
  k6:
    image: grafana/k6:0.57.0
    profiles: ["pruebas"]
    volumes:
      - ./pruebas-carga:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  datos-postgres:
